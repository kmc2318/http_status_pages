<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>500 Internal Server Error</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #f7f8f6;
      color: #162232;
      font-family: "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      display: flex;
      align-items: center;
      gap: 80px;
    }

    .code {
      font-size: 120px;
      font-weight: bold;
    }

    .title {
      font-size: 32px;
      font-weight: bold;
      margin: 20px 0;
    }

    .message {
      font-family: sans-serif;
      font-size: 18px;
      line-height: 1.8;
    }

    .dog {
      font-size: 120px;
      text-align: center;
    }

    .server {
      font-size: 80px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div>
      <div class="code">500</div>
      <div class="title">Internal Server Error</div>
      <div class="message">
        サーバーでエラーが発生しました。<br>
        犬もびっくりして、ただいま原因を探しています。<br>
        しばらく時間をおいてから、再度お試しください。
      </div>
    </div>

    <div class="dog">
      🐕💦<br>
      <span class="server">🖥️💥</span>
    </div>
  </div>
</body>
</html>
