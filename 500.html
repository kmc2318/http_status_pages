<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>500 Internal Server Error</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f8f6;
      color: #162232;
      font-family: "Courier New", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 1050px;
      min-height: 520px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 40px 70px;
      gap: 40px;
    }

    .text {
      width: 48%;
    }

    .code {
      font-size: 120px;
      line-height: 0.9;
      font-weight: bold;
      letter-spacing: 8px;
      text-shadow: 4px 4px 0 #d9dee3;
    }

    .title {
      font-size: 30px;
      font-weight: bold;
      margin: 24px 0 32px;
      letter-spacing: 2px;
    }

    .message {
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      font-size: 18px;
      line-height: 1.9;
      color: #1d1d1d;
    }

    .art {
      width: 430px;
      height: 360px;
      position: relative;
    }

    .dog {
      position: absolute;
      left: 40px;
      bottom: 18px;
      width: 250px;
      height: 260px;
    }

    .head {
      position: absolute;
      left: 35px;
      top: 30px;
      width: 190px;
      height: 170px;
      background: #fff;
      border: 8px solid #162232;
      border-radius: 48%;
      z-index: 4;
    }

    .spot {
      position: absolute;
      left: 0;
      top: 0;
      width: 88px;
      height: 76px;
      background: #9aa8b3;
      border-radius: 38% 0 60% 0;
    }

    .ear {
      position: absolute;
      top: 35px;
      width: 62px;
      height: 120px;
      background: #9aa8b3;
      border: 8px solid #162232;
      border-radius: 35px 35px 45px 45px;
      z-index: 2;
    }

    .ear.left {
      left: 10px;
      transform: rotate(12deg);
    }

    .ear.right {
      right: 10px;
      transform: rotate(-12deg);
    }

    .eye {
      position: absolute;
      top: 74px;
      width: 18px;
      height: 24px;
      background: #162232;
      border-radius: 50%;
    }

    .eye.left { left: 55px; }
    .eye.right { right: 55px; }

    .sweat {
      position: absolute;
      width: 12px;
      height: 22px;
      background: #b8d8e8;
      border: 4px solid #162232;
      border-radius: 50%;
      transform: rotate(20deg);
    }

    .s1 { left: 25px; top: 65px; }
    .s2 { right: 22px; top: 55px; }
    .s3 { right: 40px; top: 100px; }

    .muzzle {
      position: absolute;
      left: 52px;
      top: 104px;
      width: 82px;
      height: 54px;
      background: #f7f8f6;
      border: 6px solid #162232;
      border-radius: 45px;
    }

    .nose {
      position: absolute;
      left: 28px;
      top: 7px;
      width: 24px;
      height: 17px;
      background: #162232;
      border-radius: 50%;
    }

    .mouth {
      position: absolute;
      left: 26px;
      top: 28px;
      width: 30px;
      height: 16px;
      border-bottom: 6px solid #e5845f;
      border-radius: 0 0 30px 30px;
    }

    .body {
      position: absolute;
      left: 73px;
      bottom: 10px;
      width: 110px;
      height: 100px;
      background: #fff;
      border: 8px solid #162232;
      border-radius: 42px 42px 24px 24px;
      z-index: 2;
    }

    .paw {
      position: absolute;
      bottom: 0;
      width: 50px;
      height: 68px;
      background: #fff;
      border: 8px solid #162232;
      border-radius: 28px;
      z-index: 5;
    }

    .paw.left { left: 62px; }
    .paw.right { right: 62px; }

    .tail {
      position: absolute;
      left: 10px;
      bottom: 75px;
      width: 70px;
      height: 30px;
      background: #9aa8b3;
      border: 8px solid #162232;
      border-radius: 30px;
      transform: rotate(35deg);
      z-index: 1;
    }

    .server {
      position: absolute;
      right: 20px;
      bottom: 26px;
      width: 115px;
      height: 175px;
      background: #2d4050;
      border: 8px solid #162232;
      box-shadow: 10px 10px 0 #b8c4cc;
    }

    .server::before {
      content: "";
      position: absolute;
      left: 18px;
      top: 30px;
      width: 64px;
      height: 8px;
      background: #162232;
      box-shadow:
        0 35px 0 #162232,
        0 70px 0 #162232;
    }

    .light {
      position: absolute;
      left: 18px;
      width: 12px;
      height: 12px;
      background: #f5b45f;
      border-radius: 50%;
    }

    .l1 { top: 82px; }
    .l2 { top: 118px; background: #f4d879; }

    .smoke {
      position: absolute;
      right: 55px;
      bottom: 205px;
      width: 45px;
      height: 45px;
      background: #9aa8b3;
      border-radius: 50%;
      box-shadow:
        20px -22px 0 #9aa8b3,
        42px -5px 0 #9aa8b3,
        18px 20px 0 #9aa8b3;
      opacity: 0.9;
    }

    .ground {
      position: absolute;
      left: 35px;
      bottom: 0;
      width: 360px;
      height: 18px;
      background: #b8c4cc;
      border-radius: 50%;
    }

    @media (max-width: 800px) {
      .page {
        flex-direction: column;
        padding: 40px 20px;
        text-align: center;
      }

      .text {
        width: 100%;
      }

      .code {
        font-size: 90px;
      }

      .art {
        transform: scale(0.85);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="text">
      <div class="code">500</div>
      <div class="title">Internal Server Error</div>
      <p class="message">
        サーバーでエラーが発生しました。<br>
        犬もびっくりして、ただいま原因を探しています。<br>
        しばらく時間をおいてから、再度お試しください。
      </p>
    </section>

    <section class="art">
      <div class="smoke"></div>

      <div class="dog">
        <div class="tail"></div>
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="body"></div>
        <div class="paw left"></div>
        <div class="paw right"></div>

        <div class="head">
          <div class="spot"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="sweat s1"></div>
          <div class="sweat s2"></div>
          <div class="sweat s3"></div>
          <div class="muzzle">
            <div class="nose"></div>
            <div class="mouth"></div>
          </div>
        </div>
      </div>

      <div class="server">
        <div class="light l1"></div>
        <div class="light l2"></div>
      </div>

      <div class="ground"></div>
    </section>
  </main>
</body>
</html>
