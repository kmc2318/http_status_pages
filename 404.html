<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>404 Not Found</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f3e8;
      font-family: sans-serif;
      color: #333;
    }

    .card {
      width: 80%;
      max-width: 600px;
      padding: 40px;
      text-align: center;
      background: white;
      border: 4px solid #333;
      box-shadow: 10px 10px 0 #333;
    }

    .code {
      font-size: 80px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .face {
      font-size: 70px;
      margin: 20px 0;
    }

    h1 {
      margin: 10px 0;
      font-size: 32px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    .small {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <div class="face">🐄💨</div>
    <h1>ページが見つかりません</h1>
    <p>
      探していたページは、どこかへお散歩に出かけたようです。<br>
      URLが間違っているか、ページが移動された可能性があります。
    </p>
    <div class="small">404 Not Found</div>
  </div>
</body>
</html>
