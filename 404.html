<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>404 Not Found</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #f6efe3;
      color: #2b2b2b;
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 80%;
      max-width: 620px;
      padding: 45px 35px;
      background: #fffdf8;
      border: 4px solid #2b2b2b;
      box-shadow: 12px 12px 0 #2b2b2b;
      text-align: center;
    }

    .number {
      font-size: 90px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .animal {
      font-size: 72px;
      margin: 15px 0;
    }

    h1 {
      font-size: 30px;
      margin: 10px 0 20px;
    }

    p {
      font-size: 17px;
      line-height: 1.8;
    }

    .small {
      margin-top: 25px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="number">404</div>
    <div class="animal">🐕💨</div>
    <h1>ページが見つかりません</h1>
    <p>
      探していたページは、どこかへ散歩に出かけたようです。<br>
      URLが間違っているか、ページが移動された可能性があります。
    </p>
    <div class="small">404 Not Found</div>
  </div>
</body>
</html>
